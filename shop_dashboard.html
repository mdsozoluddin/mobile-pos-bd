<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Shop Dashboard - Mobile POS BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-emerald-800 text-white flex flex-col">
        <div class="p-5 text-xl font-bold border-b border-emerald-700">Retail Shop Portal</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block py-2.5 px-4 rounded bg-emerald-700 text-white font-medium">POS বিক্রয় টার্মিনাল</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-emerald-700">স্টক ও ইনভেন্টরি</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-emerald-700">IMEI ট্র্যাক</a>
            <a href="#" class="block py-2.5 px-4 rounded hover:bg-emerald-700">বিক্রয় ইতিহাস</a>
        </nav>
        <div class="p-4 border-t border-emerald-700">
            <a href="index.html" class="block text-center bg-red-600 hover:bg-red-700 py-2 rounded text-white font-medium">লগআউট</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-semibold text-emerald-800">পয়েন্ট অব সেলস (POS)</h1>
            <span class="text-sm bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">শপ আইডি: #POS-102</span>
        </header>

        <main class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Product Scanning Section -->
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-bold mb-4 text-emerald-800">পণ্য স্ক্যান বা সিলেক্ট করুন</h2>
                    <input type="text" placeholder="IMEI বা প্রোডাক্টের নাম লিখে সার্চ করুন..." class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-emerald-600 mb-4">
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 text-center text-gray-500">
                        কার্টে কোনো পণ্য যোগ করা হয়নি
                    </div>
                </div>

                <!-- Billing Section -->
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold mb-4 text-emerald-800">বিল সামারি</h2>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span>মোট আইটেম:</span>
                            <span class="font-bold">০ টি</span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-100">
                            <span>সর্বমোট টাকা:</span>
                            <span class="font-bold text-emerald-600">৳ ০.০০</span>
                        </div>
                    </div>
                    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg mt-4 transition duration-200">পেমেন্ট সম্পন্ন করুন & প্রিন트</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
