<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Login - Mobile POS BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyBg" class="bg-slate-900 flex items-center justify-center min-h-screen transition-colors duration-300">

    <div class="absolute top-5 right-5 flex gap-3">
        <!-- Language Switcher -->
        <select id="langSelect" onchange="changeLanguage()" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
            <option value="bn">বাংলা (Bangla)</option>
            <option value="en">English</option>
        </select>

        <!-- Theme Switcher -->
        <select id="themeSelect" onchange="changeTheme()" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
            <option value="green">🟢 Green Theme</option>
            <option value="pink">🩷 Pink Theme</option>
            <option value="blue">🔵 Blue Theme</option>
        </select>
    </div>

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Mobile POS BD</h1>
            <p id="subTitle" class="text-slate-400 text-sm">Retail & Inventory Management System</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label id="labelUser" class="block text-slate-300 text-sm font-medium mb-2">User ID / Username</label>
                <input type="text" id="username" required class="w-full bg-slate-700 text-white border border-slate-600 rounded-xl p-3 focus:outline-none focus:border-emerald-500" placeholder="User ID din (jemon: admin ba shop)">
            </div>

            <div>
                <label id="labelPass" class="block text-slate-300 text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-700 text-white border border-slate-600 rounded-xl p-3 focus:outline-none focus:border-emerald-500" placeholder="••••••••">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl transition duration-200 shadow-lg">Login</button>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4">
            <p id="regText" class="text-slate-400 text-sm">Retail shop account nei?</p>
            <button onclick="openRegisterModal()" id="regBtnText" class="text-emerald-400 font-medium text-sm hover:underline mt-1">Notun Account Khulun (Register)</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-md border border-slate-700 text-white">
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-emerald-400">Retail Shop Account Registration</h3>
            <p id="modalDesc" class="text-sm text-slate-300 mb-4">Ekhane notun shop registration form ba details thakbe.</p>
            <button onclick="closeRegisterModal()" id="modalClose" class="w-full bg-rose-600 hover:bg-rose-500 py-2 rounded-xl font-medium">Bondo korun</button>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (username === 'admin' && password === 'admin') {
                window.location.href = 'dashboard.html';
            } else if (username !== '' && password !== '') {
                window.location.href = 'shop_dashboard.html';
            } else {
                alert('Sothik User ID ebong Password din!');
            }
        }

        function openRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        // Language Translation Dictionary
        const translations = {
            bn: {
                subTitle: "রিটেইল ও ইনভেন্টরি ম্যানেজমেন্ট সিস্টেম",
                labelUser: "ইউজার আইডি / ইউজারনেম",
                labelPass: "পাসওয়ার্ড",
                loginBtn: "লগইন করুন",
                regText: "রিটেইল শপ অ্যাকাউন্ট নেই?",
                regBtnText: "নতুন অ্যাকাউন্ট খুলুন (Register)",
                modalTitle: "রিটেইল শপ অ্যাকাউন্ট রেজিস্ট্রেশন",
                modalDesc: "এখানে নতুন শপ রেজিস্ট্রেশন ফর্ম বা ডিটেইলস থাকবে।",
                modalClose: "বন্ধ করুন"
            },
            en: {
                subTitle: "Retail & Inventory Management System",
                labelUser: "User ID / Username",
                labelPass: "Password",
                loginBtn: "Login",
                regText: "Don't have a retail shop account?",
                regBtnText: "Open New Account (Register)",
                modalTitle: "Retail Shop Account Registration",
                modalDesc: "New shop registration form details will be here.",
                modalClose: "Close"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('htmlRoot').lang = lang;
            
            if(translations[lang]) {
                document.getElementById('subTitle').innerText = translations[lang].subTitle;
                document.getElementById('labelUser').innerText = translations[lang].labelUser;
                document.getElementById('labelPass').innerText = translations[lang].labelPass;
                document.getElementById('loginBtn').innerText = translations[lang].loginBtn;
                document.getElementById('regText').innerText = translations[lang].regText;
                document.getElementById('regBtnText').innerText = translations[lang].regBtnText;
                document.getElementById('modalTitle').innerText = translations[lang].modalTitle;
                document.getElementById('modalDesc').innerText = translations[lang].modalDesc;
                document.getElementById('modalClose').innerText = translations[lang].modalClose;
            }
        }

        function changeTheme() {
            const theme = document.getElementById('themeSelect').value;
            const btn = document.getElementById('loginBtn');
            const modalTitle = document.getElementById('modalTitle');
            const regBtnText = document.getElementById('regBtnText');

            // Reset classes
            btn.className = "w-full text-white font-bold p-3 rounded-xl transition duration-200 shadow-lg";
            
            if (theme === 'green') {
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                modalTitle.className = "text-xl font-bold mb-4 text-emerald-400";
                regBtnText.className = "text-emerald-400 font-medium text-sm hover:underline mt-1";
            } else if (theme === 'pink') {
                btn.classList.add('bg-pink-600', 'hover:bg-pink-500');
                modalTitle.className = "text-xl font-bold mb-4 text-pink-400";
                regBtnText.className = "text-pink-400 font-medium text-sm hover:underline mt-1";
            } else if (theme === 'blue') {
                btn.classList.add('bg-blue-600', 'hover:bg-blue-500');
                modalTitle.className = "text-xl font-bold mb-4 text-blue-400";
                regBtnText.className = "text-blue-400 font-medium text-sm hover:underline mt-1";
            }
        }
    </script>
</body>
</html>
